name: 宿主兼容巡检
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - if: runner.os == 'Windows'
        run: pnpm test:e2e
      - if: runner.os == 'macOS'
        run: pnpm test:e2e e2e/plugin.test.ts
  preview:
    strategy:
      fail-fast: false
      matrix:
        channel: [next, alpha]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安装同一版本的宿主、SDK 和测试框架
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          version=$(npm view "@deepseek-ai/dsh@$CHANNEL" version --workspaces=false)
          pnpm host:prepare "$version"
          pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - name: 报告兼容故障
        if: failure()
        run: echo '::warning::DSH ${{ matrix.channel }} 兼容检查失败，请查看此任务日志。'
